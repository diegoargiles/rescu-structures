<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><style>text{font-family:Arial;fill:#213547} .small{font-size:17px}.title{font-size:28px;font-weight:bold}.part{fill:#d5eee8;stroke:#1f645c;stroke-width:1.5}.hole{fill:white;stroke:#213547;stroke-width:.3}.dim{stroke:#607689;stroke-width:.25;fill:none}</style><rect width="1400" height="900" fill="#f6f8fb"/><text x="45" y="50" class="title">P05 motor mount · nominal fabrication review</text><text x="45" y="82" class="small">Dimensions in mm · proposed construction · NOT a manufacturing release · profiles shown at enlarged scale</text><text x="80" y="135" class="title">Upper plate · G10/glass epoxy · 3 thick</text><g transform="translate(285,380) scale(6,-6)"><circle r="22" class="part"/><rect x="-10" y="-30" width="20" height="60" class="part"/><circle r="22" fill="#d5eee8"/><circle cx="0" cy="-24" r="1.7" class="hole"/><circle cx="0" cy="24" r="1.7" class="hole"/><circle cx="-6.717514421272201" cy="-6.717514421272201" r="1.7" class="hole"/><circle cx="-6.717514421272201" cy="6.717514421272201" r="1.7" class="hole"/><circle cx="6.717514421272201" cy="-6.717514421272201" r="1.7" class="hole"/><circle cx="6.717514421272201" cy="6.717514421272201" r="1.7" class="hole"/><circle cx="0" cy="0" r="5" class="hole"/><circle r="9.5" class="dim" stroke-dasharray="1,1"/><path d="M-26 0H26M0 -34V34" class="dim" stroke-dasharray="1,1"/></g><text x="80" y="605" class="small">Ø44 center; 20-wide ears; total Y length 60</text><text x="80" y="635" class="small">4 × Ø3.4 on Ø19 PCD, rotated 45°; center relief Ø10</text><text x="80" y="665" class="small">2 × Ø3.4 at X0, Y±24; edge distance 6 nominal</text><text x="80" y="695" class="small">Motor-hole centers X±6.717514, Y±6.717514</text><text x="760" y="135" class="title">Lower strap · 4 thick</text><g transform="translate(965,380) scale(6,-6)"><rect x="-12" y="-30" width="24" height="60" rx="3" class="part"/><circle cx="0" cy="-24" r="1.7" class="hole"/><circle cx="0" cy="24" r="1.7" class="hole"/><path d="M-16 0H16M0 -34V34" class="dim" stroke-dasharray="1,1"/></g><text x="760" y="605" class="small">24 × 60; corner radius 3; 2 × Ø3.4 at X0,Y±24</text><text x="760" y="635" class="small">Rails: 2 per mount, 28 × 4 × 7.6</text><text x="760" y="665" class="small">Rail bounds: X±14; Y[-15,-11] and [11,15]</text><text x="760" y="695" class="small">0.2 liner beneath rails; 0.2 adhesive above rails</text><text x="45" y="765" class="small">Motor screws: provisional M3×6 +0.5 washer → 2.5 insertion. Safe depth UNKNOWN; verify against actual motor.</text><text x="45" y="795" class="small">Clamp: 2 × M3×45 per mount, washers and locknuts. Preload and carbon crushing require test; no torque prescribed.</text><text x="45" y="825" class="small">Suggested fabrication target: hole centers ±0.10, profile ±0.20 mm; proposed, subject to fit/tolerance review.</text><text x="45" y="855" class="small">CNC/waterjet profiles need deburring, radiused/sealed laminate edges. Use native CAD for exact contours; this SVG is not CAM.</text></svg>